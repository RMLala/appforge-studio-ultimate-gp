/* Démonstration : tout passe par le domaine, données préfixées [Démo] */
function seedDemo() {
  const now = new Date();
  const ago = (n) => new Date(now.getTime() - n * 864e5);
  const ahead = (n) => new Date(now.getTime() + n * 864e5);
  if (!S.company.name) S.company = { ...S.company, name: 'AppForge Studio (démo)', address: 'Antananarivo, Madagascar' };
  const c1 = D.createClient(S, { type: 'entreprise', name: '[Démo] Société Ravo', contact: 'Contact démo', email: 'contact@example.com' }, ago(45));
  const c2 = D.createClient(S, { type: 'particulier', name: '[Démo] Client particulier', contact: 'Contact démo' }, ago(40));
  const p1 = D.createProduct(S, { name: '[Démo] Gestion de stock', identifiant: 'APP-STOCK', type: 'standard', category: 'Gestion', price: 350000, licenseType: 'annuelle', duration: '12 mois', description: 'Application standard de démonstration', status: 'actif' }, ago(60));
  D.createProduct(S, { name: '[Démo] Application sur mesure', identifiant: 'SUR-MESURE', type: 'sur mesure', category: 'Développement', price: 0, status: 'actif' }, ago(60));
  const lead = D.createLead(S, { name: 'Contact démo', company: '[Démo] Boutique', need: 'Gestion des ventes', source: 'Facebook' }, ago(10));
  D.moveLead(S, lead.id, 'Besoin identifié', 'Démo', ago(8));

  const accepted = (client, lines, date, dep = 30) => {
    const q = D.createQuote(S, { clientId: client.id, lines, depositPct: dep, globalDiscount: 0, paymentTerms: 'Démo' }, date);
    D.setQuoteStatus(S, q.id, 'envoyé', date); D.setQuoteStatus(S, q.id, 'accepté', date);
    return q;
  };
  const q1 = accepted(c1, [
    { productId: p1.id, designation: p1.name, qty: 1, price: p1.price, discount: 0 },
    { designation: 'Formation (démo)', qty: 1, price: 150000, discount: 0 }
  ], ago(44));
  const o1 = D.createOrderFromQuote(S, q1.id, ago(43));
  const acompte = D.createInvoice(S, { orderId: o1.id, type: 'acompte', amount: round2(o1.total * o1.depositPct / 100), dueDate: D.isoDay(ago(30)) }, ago(43));
  const pay1 = D.createPayment(S, { invoiceId: acompte.id, amount: acompte.amount, method: 'MVola', reference: 'DEMO-MVOLA-001', proof: 'Capture démo' }, ago(42));
  D.confirmPayment(S, pay1.id, ago(42));
  const rest = D.orderSummary(S, o1.id).toInvoice;
  const solde = D.createInvoice(S, { orderId: o1.id, type: 'solde', amount: rest, dueDate: D.isoDay(ahead(20)) }, ago(5));
  D.createPayment(S, { invoiceId: solde.id, amount: round2(rest / 2), method: 'Espèces' }, now);

  const q2 = accepted(c2, [{ designation: 'Site vitrine (démo)', qty: 1, price: 200000, discount: 0 }], ago(40));
  const o2 = D.createOrderFromQuote(S, q2.id, ago(39));
  D.createInvoice(S, { orderId: o2.id, type: 'standard', amount: o2.total, dueDate: D.isoDay(ago(10)) }, ago(39));

  const pr = D.createProject(S, { name: '[Démo] Gestion de stock — Ravo', personal: false, clientId: c1.id, orderId: o1.id, deadline: D.isoDay(ahead(60)) }, ago(38));
  for (let i = 0; i < 5; i++) D.advanceProject(S, pr.id, ago(3));
  D.createProject(S, { name: '[Démo] Outil interne', personal: true, deadline: D.isoDay(ago(5)) }, ago(20));
  const t1 = D.createTask(S, { projectId: pr.id, title: '[Démo] Maquette des écrans stock', responsable: 'Équipe démo', priority: 'Haute', deadline: D.isoDay(ahead(10)) }, ago(30));
  D.setTaskStatus(S, t1.id, 'Terminé', '', ago(20));
  D.createTask(S, { projectId: pr.id, title: '[Démo] Intégration de la base', responsable: 'Équipe démo', priority: 'Moyenne', deadline: D.isoDay(ahead(25)), dependsOn: t1.id }, ago(20));
  D.createTicket(S, { clientId: c1.id, projectId: pr.id, priority: 'Haute', title: '[Démo] Question sur les droits d’accès', description: 'Exemple de démonstration' }, ago(3));
  D.createDelivery(S, { projectId: pr.id, version: '0.1.0-démo' }, ago(2));
}

/* Rendu */
function renderUserSelect(u) {
  document.getElementById('userSel').innerHTML = S.users.map((x) => `<option value="${esc(x.id)}" ${x.id === u.id ? 'selected' : ''}>${esc(x.name)} · ${esc(x.role)}</option>`).join('');
}
function render() {
  TSEQ = 0;
  const u = D.activeUser(S);
  const allowed = ROUTES.filter((r) => D.can(u.role, r.res));
  if (!allowed.some((r) => r.id === UI.route)) UI.route = allowed[0] ? allowed[0].id : 'journal';
  if (location.hash !== '#/' + UI.route) history.replaceState(null, '', '#/' + UI.route);
  document.getElementById('nav').innerHTML = allowed.map((r) => `<a href="#/${r.id}" class="${r.id === UI.route ? 'active' : ''}">${esc(r.label)}</a>`).join('')
    + PHASE2.map((p) => `<span class="soon">${esc(p)}<small>bientôt</small></span>`).join('');
  document.getElementById('mnav').innerHTML = allowed.slice(0, 4).map((r) => `<button class="${r.id === UI.route ? 'on' : ''}" data-act="go" data-v="${r.id}">${esc(r.short)}</button>`).join('') + '<button data-act="more">Plus</button>';
  const page = PAGES[UI.route]();
  document.getElementById('title').textContent = page.title;
  document.getElementById('sub').textContent = page.sub || '';
  document.getElementById('actions').innerHTML = page.actions || '';
  document.getElementById('tabs').innerHTML = page.tabs || '';
  document.getElementById('toolbar').innerHTML = (UI.route === 'crm' || (UI.route === 'production' && UI.prodView === 'kanban')) ? `<input class="search" data-q placeholder="Rechercher…" aria-label="Rechercher" value="${esc(UI.q)}">` : '';
  document.getElementById('body').innerHTML = page.body();
  renderUserSelect(u);
}
function renderBody() { TSEQ = 0; document.getElementById('body').innerHTML = PAGES[UI.route]().body(); }
function route() {
  const m = location.hash.match(/^#\/([a-z]+)/);
  UI.route = m ? m[1] : 'dashboard';
  UI.q = '';
  closeModal();
  render();
}

/* Événements */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = ACTIONS[t.dataset.act];
  if (!fn) return;
  if (t.tagName !== 'A') e.preventDefault();
  fn(t.dataset, t);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.name === 'l_prod') {
    const row = el.closest('[data-line]'); const p = byId(S.products, el.value);
    if (p && row) { row.querySelector('[name=l_des]').value = p.name; row.querySelector('[name=l_price]').value = p.price; }
    return;
  }
  const t = el.closest && el.closest('[data-change]');
  if (t && CHANGES[t.dataset.change]) CHANGES[t.dataset.change](t.dataset, el);
});
document.addEventListener('input', (e) => {
  if (e.target.matches && e.target.matches('[data-q]')) { UI.q = e.target.value; renderBody(); return; }
  if (e.target.matches && e.target.matches('[data-qt]')) { const id = e.target.dataset.qt; UI.tq[id] = e.target.value; const el = document.querySelector('[data-tbody="' + id + '"]'); if (el) el.innerHTML = tableContent(id); }
});
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.id === 'mform' && formHandler) { e.preventDefault(); formHandler(Object.fromEntries(new FormData(f)), f); return; }
  if (f.dataset && f.dataset.form && FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](f); }
});
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
document.getElementById('importFile').addEventListener('change', (e) => {
  const el = e.target; const f = el.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      const lists = ['users', 'clients', 'products', 'leads', 'quotes', 'orders', 'invoices', 'credits', 'payments', 'projects', 'licenses', 'licenseRegister', 'tasks', 'deliveries', 'tickets', 'relances', 'audit', 'paymentModes'];
      if (!obj || obj.schema !== 1 || lists.some((k) => !Array.isArray(obj[k]))) throw new Error('format de sauvegarde non reconnu');
      if (!confirm('Remplacer les données actuelles par cette sauvegarde ? L’état actuel sera conservé dans ce navigateur.')) return;
      try { localStorage.setItem(APP.KEY + '_before_import', JSON.stringify(S)); } catch (err) { /* stockage plein */ }
      S = D.ensureP2(obj); run(() => {});
    } catch (err) { toast('Fichier invalide : ' + err.message, 'err'); }
    el.value = '';
  };
  r.readAsText(f);
});
