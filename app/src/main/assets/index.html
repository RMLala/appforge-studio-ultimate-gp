<!doctype html>
<html lang="fr">
<head>
<!-- Release: v1.1.1 | AppForge Business Ultimate V3 + R2 | 2026-11-25 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AppForge Studio Business Ultimate — V3 + R2 · v1.1.1</title>
<style>
:root{--p1:#2563eb;--p2:#7c3aed;--grad:linear-gradient(135deg,#2563eb,#7c3aed);--bg:#f4f5fb;--card:#fff;--tx:#18192b;--mu:#666c86;--bd:#e4e7f2;--r:12px;color-scheme:light}
[data-theme=dark]{--bg:#0e1020;--card:#171a2e;--tx:#e9ebfa;--mu:#9da3c4;--bd:#2a2f4a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:18px;margin:0 8px 16px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
aside nav a,.soon{display:block;padding:9px 12px;border-radius:9px;color:var(--tx);text-decoration:none;margin:2px 0}
aside nav a.active{background:var(--grad);color:#fff}
.soon{color:var(--mu);cursor:default}
.soon small{font-size:11px;background:var(--bd);padding:1px 6px;border-radius:6px;margin-left:4px}
main{min-width:0;padding:22px 26px 100px}
.top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:22px;margin:0}
.sub{color:var(--mu);font-size:13px;margin-top:2px;max-width:70ch}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gap{margin-top:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
button.primary{background:var(--grad);color:#fff;border-color:transparent}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:13px}
button.on{background:var(--grad);color:#fff;border-color:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
label input,label select,label textarea{margin-top:4px}
.check{display:flex;gap:8px;align-items:center;color:var(--tx)}
.check input{width:auto;margin:0}
.note{font-size:13px;color:var(--mu);margin:0 0 10px}
.search{max-width:320px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:11px;border-top:3px solid var(--p1)}
.kpi span{display:block;color:var(--mu);font-size:13px}
.kpi strong{display:block;font-size:17px;margin:4px 0}
.kpi small{color:var(--mu);font-size:12px}
.kpi.ok{border-top-color:#16a34a}.kpi.warn{border-top-color:#f59e0b}.kpi.bad{border-top-color:#ef4444}
.tablewrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle;font-size:14px}
th{color:var(--mu);font-weight:600;font-size:13px}
.mu{color:var(--mu);font-size:13px}.warnText{color:#b45309;font-size:12px;margin:10px 0 0}[data-theme=dark] .warnText{color:#fbbf24}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bd);color:var(--tx)}
.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.danger{background:#fee2e2;color:#991b1b}.badge.info{background:#e0e7ff;color:#3730a3}
[data-theme=dark] .badge.ok{background:#14532d;color:#bbf7d0}[data-theme=dark] .badge.warn{background:#78350f;color:#fde68a}[data-theme=dark] .badge.danger{background:#7f1d1d;color:#fecaca}[data-theme=dark] .badge.info{background:#312e81;color:#c7d2fe}
.empty{padding:26px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:var(--r)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:8px;min-height:120px}
.col h3{font-size:13px;margin:4px 4px 8px;color:var(--mu)}
.lead{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.lead strong{display:block}.lead small{color:var(--mu)}.lead p{margin:6px 0;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);color:var(--tx);border-radius:14px;width:min(780px,100%);max-height:92vh;overflow:auto;border:1px solid var(--bd);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal>header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd)}
.modal h2{margin:0;font-size:17px}
.mbody{padding:16px 18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.formgrid .full{grid-column:1/-1}
footer.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.line{display:grid;grid-template-columns:1.1fr 2fr .7fr 1fr .7fr auto;gap:6px;margin-bottom:6px}
.line input,.line select{margin:0}
.steps{padding-left:0;list-style:none;margin:0 0 14px}
.steps li{padding:7px 10px;border-radius:8px;margin-bottom:4px;border:1px solid var(--bd);color:var(--mu)}
.steps li.done{color:var(--tx);border-color:#16a34a}
.steps li.cur{color:#fff;background:var(--grad);border-color:transparent}
.menu a{display:block;padding:10px 12px;border-radius:9px;color:var(--tx);text-decoration:none}
.menu a:hover{background:var(--bg)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:10px;border-radius:8px;font-size:12px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;color:#fff;background:#111827;z-index:99;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{display:block}.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
.mnav{display:none}
#printArea{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  main{padding:16px 14px 110px}
  .grid2,.formgrid{grid-template-columns:1fr}
  .line{grid-template-columns:1fr 1fr}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
  .mnav button{border:0;background:transparent;font-size:12px;padding:8px 2px}
  .mnav button.on{color:#fff;background:var(--grad);border-radius:10px}
  .search{max-width:none}
}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:24px;color:#000;background:#fff}
  #printArea table{min-width:0}
}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.kpi{padding:9px}.kpi strong{font-size:15px;word-break:break-word}.kpi span{font-size:12px}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">AppForge Studio Business Ultimate</div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="right">
        <div class="row" id="actions"></div>
        <select data-change="user" id="userSel" aria-label="Profil actif" style="width:auto"></select>
        <button data-act="toggleTheme" aria-label="Mode clair ou sombre">◐</button>
      </div>
    </div>
    <div class="row gap" id="tabs"></div>
    <div id="toolbar"></div>
    <div id="body"></div>
  </main>
</div>
<nav class="mnav" id="mnav"></nav>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* @domain-start */
const Domain = (() => {
  class DomainError extends Error {}
  const fail = (m) => { throw new DomainError(m); };
  const EPS = 0.005;
  const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const pad = (n) => String(n).padStart(2, '0');
  const isoDay = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const trimmed = (d, k) => String(d[k] ?? '').trim();
  const requireText = (v, msg) => { const s = String(v ?? '').trim(); if (!s) fail(msg); return s; };
  const find = (arr, id, msg) => { const x = arr.find((e) => e.id === id); if (!x) fail(msg || 'Élément introuvable.'); return x; };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const sum = (arr, f) => round2(arr.reduce((s, x) => s + f(x), 0));
  const pct = (v, msg) => { const n = Number(v) || 0; if (n < 0 || n > 100) fail(msg); return n; };

  const RESOURCES = ['dashboard', 'crm', 'catalogue', 'ventes', 'paiements', 'projets', 'licences', 'support', 'admin', 'journal'];
  const PERMS = {
    'Administrateur': { dashboard: 'rw', crm: 'rw', catalogue: 'rw', ventes: 'rw', paiements: 'rw', projets: 'rw', licences: 'rw', support: 'rw', admin: 'rw', journal: 'rw' },
    'Direction': { dashboard: 'r', crm: 'r', catalogue: 'r', ventes: 'r', paiements: 'rw', projets: 'r', licences: 'r', support: 'r', admin: 'r', journal: 'r' },
    'Commercial': { dashboard: 'r', crm: 'rw', catalogue: 'r', ventes: 'rw', paiements: 'r', projets: 'r', support: 'r' },
    'Gestionnaire de projets': { dashboard: 'r', crm: 'r', ventes: 'r', projets: 'rw', licences: 'r', support: 'r' },
    'Développeur': { projets: 'rw' },
    'Responsable livraison': { ventes: 'r', projets: 'rw', licences: 'r', support: 'r' },
    'Support': { crm: 'r', projets: 'r', licences: 'r', support: 'rw' }
  };
  const ROLES = Object.keys(PERMS);
  const LEAD_STAGES = ['Nouveau', 'Contacté', 'Besoin identifié', 'Offre présentée', 'Devis envoyé', 'Négociation', 'Gagné', 'Perdu'];
  const LEAD_CLOSED = ['Gagné', 'Perdu'];
  const PROJECT_STAGES = ['Analyse', 'Cahier des charges', 'Proposition', 'Devis accepté', 'Acompte reçu', 'Conception', 'Développement', 'Tests', 'Validation client', 'Livraison', 'Solde reçu', 'Maintenance'];
  const QUOTE_FLOW = { 'brouillon': ['envoyé'], 'envoyé': ['accepté', 'refusé'], 'accepté': [], 'refusé': ['brouillon'] };
  const ORDER_FLOW = { 'confirmée': ['en production'], 'en production': ['livrée'], 'livrée': [] };
  const INVOICE_TYPES = ['acompte', 'solde', 'standard'];
  const PRODUCT_TYPES = ['standard', 'sur mesure', 'prestation', 'extension', 'maintenance', 'support', 'renouvellement'];
  const LICENSE_TYPES = ['essai 72 heures', 'mensuelle', 'annuelle', 'à vie'];
  const UPDATABLE = {
    clients: ['type', 'name', 'contact', 'email', 'phone', 'nif', 'stat', 'address'],
    products: ['name', 'category', 'duration', 'description', 'status', 'licenseType'],
    leads: ['name', 'company', 'email', 'phone', 'need', 'source'],
    projects: ['name', 'deadline', 'notes']
  };
  const RES_OF = { clients: 'crm', leads: 'crm', products: 'catalogue', projects: 'projets' };

  function emptyState() {
    return { schema: 1, company: { name: '', nif: '', stat: '', address: '', phone: '', email: '' },
      users: [{ id: 'usr-admin', name: 'Administrateur local', role: 'Administrateur' }], activeUserId: 'usr-admin',
      counters: {}, clients: [], leads: [], products: [], quotes: [], orders: [], invoices: [], credits: [],
      payments: [], projects: [], licenses: [], paymentModes: ['MVola', 'Espèces', 'Virement'], audit: [], tasks: [], deliveries: [], tickets: [], relances: [], licenseRegister: [],
      createdAt: new Date().toISOString() };
  }
  function activeUser(state) { return state.users.find((u) => u.id === state.activeUserId) || state.users[0]; }
  function can(role, res, level = 'r') { const p = (PERMS[role] || {})[res] || ''; return level === 'r' ? p.length > 0 : p === 'rw'; }
  function assertCan(state, res, level) {
    const u = activeUser(state);
    if (!u) fail('Aucun profil actif.');
    if (!can(u.role, res, level)) fail(`Action refusée : le profil « ${u.role} » n'a pas le droit ${level === 'w' ? 'de modification' : 'de lecture'} sur « ${res} ».`);
    return u;
  }
  function audit(state, action, entity, label, now = new Date()) {
    const u = activeUser(state);
    state.audit.push({ id: uid(), at: now.toISOString(), user: u ? u.name : '—', role: u ? u.role : '—', action, entity, label });
  }
  function nextNumber(state, prefix, now = new Date()) {
    const y = now.getFullYear(); const k = `${prefix}-${y}`;
    state.counters[k] = (state.counters[k] || 0) + 1;
    return `${prefix}-${y}-${String(state.counters[k]).padStart(4, '0')}`;
  }

  /* Utilisateurs, profils, paramètres */
  function createUser(state, d, now = new Date()) {
    assertCan(state, 'admin', 'w');
    const name = requireText(d.name, 'Nom de l’utilisateur obligatoire.');
    if (!ROLES.includes(d.role)) fail('Profil inconnu.');
    const u = { id: uid(), name, role: d.role };
    state.users.push(u); audit(state, 'création', 'utilisateurs', name, now); return u;
  }
  function saveCompany(state, d, now = new Date()) {
    assertCan(state, 'admin', 'w');
    state.company = { name: requireText(d.name, 'Nom de l’entreprise obligatoire.'), nif: trimmed(d, 'nif'), stat: trimmed(d, 'stat'), address: trimmed(d, 'address'), phone: trimmed(d, 'phone'), email: trimmed(d, 'email') };
    audit(state, 'modification', 'entreprise', state.company.name, now); return state.company;
  }
  function createPaymentMode(state, name, now = new Date()) {
    assertCan(state, 'admin', 'w');
    const n = requireText(name, 'Nom du mode de paiement obligatoire.');
    if (state.paymentModes.some((m) => m.toLowerCase() === n.toLowerCase())) fail('Ce mode de paiement existe déjà.');
    state.paymentModes.push(n); audit(state, 'création', 'modes de paiement', n, now); return n;
  }

  /* CRM */
  function createClient(state, d, now = new Date()) {
    assertCan(state, 'crm', 'w');
    const name = requireText(d.name, 'Nom du client obligatoire.');
    const c = { id: uid(), number: nextNumber(state, 'CLI', now), type: d.type === 'particulier' ? 'particulier' : 'entreprise', name,
      contact: trimmed(d, 'contact'), email: trimmed(d, 'email'), phone: trimmed(d, 'phone'), nif: trimmed(d, 'nif'), stat: trimmed(d, 'stat'),
      address: trimmed(d, 'address'), createdAt: isoDay(now), fromLeadId: d.fromLeadId || null };
    state.clients.push(c); audit(state, 'création', 'clients', name, now); return c;
  }
  function createLead(state, d, now = new Date()) {
    assertCan(state, 'crm', 'w');
    const name = requireText(d.name, 'Nom du prospect obligatoire.');
    const l = { id: uid(), name, company: trimmed(d, 'company'), email: trimmed(d, 'email'), phone: trimmed(d, 'phone'),
      need: trimmed(d, 'need'), source: trimmed(d, 'source'), stage: 'Nouveau', clientId: null, createdAt: isoDay(now),
      history: [{ at: isoDay(now), stage: 'Nouveau', comment: 'Création' }] };
    state.leads.push(l); audit(state, 'création', 'prospects', name, now); return l;
  }
  function moveLead(state, id, stage, comment = '', now = new Date()) {
    assertCan(state, 'crm', 'w');
    const l = find(state.leads, id, 'Prospect introuvable.');
    if (!LEAD_STAGES.includes(stage)) fail('Étape inconnue.');
    if (LEAD_CLOSED.includes(l.stage)) fail('Un prospect clôturé ne peut plus changer d’étape.');
    if (stage === l.stage) return l;
    l.stage = stage; l.history.push({ at: isoDay(now), stage, comment: String(comment || '').trim() });
    audit(state, 'changement d’étape', 'prospects', `${l.name} → ${stage}`, now); return l;
  }
  function convertLead(state, id, now = new Date()) {
    assertCan(state, 'crm', 'w');
    const l = find(state.leads, id, 'Prospect introuvable.');
    if (l.clientId) fail('Ce prospect est déjà converti en client.');
    const c = createClient(state, { type: l.company ? 'entreprise' : 'particulier', name: l.company || l.name,
      contact: l.company ? l.name : '', email: l.email, phone: l.phone, fromLeadId: l.id }, now);
    l.clientId = c.id; audit(state, 'conversion', 'prospects', `${l.name} → client ${c.number}`, now); return c;
  }

  /* Catalogue */
  function createProduct(state, d, now = new Date()) {
    assertCan(state, 'catalogue', 'w');
    const name = requireText(d.name, 'Nom du produit obligatoire.');
    const identifiant = requireText(d.identifiant, 'Identifiant produit obligatoire.');
    if (state.products.some((p) => p.identifiant.toLowerCase() === identifiant.toLowerCase())) fail('Cet identifiant produit existe déjà.');
    if (!PRODUCT_TYPES.includes(d.type)) fail('Type de produit inconnu.');
    const price = round2(d.price);
    if (!(price >= 0)) fail('Prix invalide.');
    const licenseType = d.licenseType || '';
    if (licenseType && !LICENSE_TYPES.includes(licenseType)) fail('Type de licence inconnu.');
    const p = { id: uid(), name, identifiant, type: d.type, category: trimmed(d, 'category'), price, licenseType,
      duration: trimmed(d, 'duration'), description: trimmed(d, 'description'), status: d.status === 'inactif' ? 'inactif' : 'actif', createdAt: isoDay(now) };
    state.products.push(p); audit(state, 'création', 'produits', name, now); return p;
  }
  function updateEntity(state, coll, id, patch, now = new Date()) {
    assertCan(state, RES_OF[coll] || 'admin', 'w');
    if (!UPDATABLE[coll]) fail('Modification non autorisée sur ce type de données.');
    const rec = find(state[coll], id, 'Élément introuvable.');
    UPDATABLE[coll].forEach((k) => { if (k in patch) rec[k] = typeof patch[k] === 'string' ? patch[k].trim() : patch[k]; });
    if (coll === 'products') {
      if ('price' in patch) { const p = round2(patch.price); if (!(p >= 0)) fail('Prix invalide.'); rec.price = p; }
      if (rec.status !== 'actif' && rec.status !== 'inactif') fail('Statut produit invalide.');
    }
    if (coll === 'clients' && !['particulier', 'entreprise'].includes(rec.type)) fail('Type de client invalide.');
    if (!rec.name) fail('Le nom ne peut pas être vide.');
    audit(state, 'modification', coll, rec.name, now); return rec;
  }

  /* Devis */
  function computeLines(lines, globalDiscount = 0) {
    const rows = (lines || []).map((l) => {
      const qty = Number(l.qty); const pu = Number(l.price); const d = Number(l.discount) || 0;
      const designation = String(l.designation ?? '').trim();
      if (!designation || !(qty > 0)) fail('Chaque ligne doit avoir une désignation et une quantité supérieure à 0.');
      if (!(pu >= 0)) fail('Prix unitaire invalide.');
      if (d < 0 || d > 100) fail('Remise de ligne entre 0 et 100 %.');
      return { designation, productId: l.productId || null, qty, price: round2(pu), discount: d, total: round2(qty * pu * (1 - d / 100)) };
    });
    if (!rows.length) fail('Le document doit contenir au moins une ligne.');
    const subtotal = round2(rows.reduce((s, r) => s + r.total, 0));
    const gd = pct(globalDiscount, 'Remise globale entre 0 et 100 %.');
    const discount = round2(subtotal * gd / 100);
    return { lines: rows, subtotal, globalDiscount: gd, discount, total: round2(subtotal - discount) };
  }
  function createQuote(state, d, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const client = find(state.clients, d.clientId, 'Client introuvable.');
    const c = computeLines(d.lines, d.globalDiscount);
    const q = { id: uid(), number: nextNumber(state, 'DEV', now), clientId: client.id, status: 'brouillon', revisions: 0,
      createdAt: isoDay(now), validUntil: trimmed(d, 'validUntil'), paymentTerms: trimmed(d, 'paymentTerms'),
      depositPct: pct(d.depositPct, 'Acompte entre 0 et 100 %.'), ...c };
    state.quotes.push(q); audit(state, 'création', 'devis', q.number, now); return q;
  }
  function setQuoteStatus(state, id, status, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const q = find(state.quotes, id, 'Devis introuvable.');
    if (!(QUOTE_FLOW[q.status] || []).includes(status)) fail(`Passage de « ${q.status} » à « ${status} » impossible.`);
    if (q.status === 'refusé' && status === 'brouillon') q.revisions += 1;
    q.status = status; audit(state, 'statut', 'devis', `${q.number} → ${status}`, now); return q;
  }

  /* Commandes */
  function createOrderFromQuote(state, quoteId, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const q = find(state.quotes, quoteId, 'Devis introuvable.');
    if (q.status !== 'accepté') fail('Seul un devis accepté peut devenir une commande.');
    if (state.orders.some((o) => o.quoteId === q.id)) fail('Ce devis a déjà une commande.');
    const o = { id: uid(), number: nextNumber(state, 'CMD', now), quoteId: q.id, quoteNumber: q.number, clientId: q.clientId,
      lines: clone(q.lines), subtotal: q.subtotal, globalDiscount: q.globalDiscount, discount: q.discount, total: q.total,
      depositPct: q.depositPct, status: 'confirmée', createdAt: isoDay(now) };
    state.orders.push(o); audit(state, 'création', 'commandes', o.number, now); return o;
  }
  function setOrderStatus(state, id, status, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const o = find(state.orders, id, 'Commande introuvable.');
    if (!(ORDER_FLOW[o.status] || []).includes(status)) fail(`Passage de « ${o.status} » à « ${status} » impossible.`);
    o.status = status; audit(state, 'statut', 'commandes', `${o.number} → ${status}`, now); return o;
  }

  /* Factures, avoirs, paiements : montants séparés */
  function invoiceCredits(state, id) { return sum(state.credits.filter((c) => c.invoiceId === id), (c) => c.amount); }
  function invoiceNet(state, inv) { return round2(inv.amount - invoiceCredits(state, inv.id)); }
  function invoicePaid(state, id) { return sum(state.payments.filter((p) => p.invoiceId === id && p.status === 'confirmé'), (p) => p.amount); }
  function invoiceDue(state, inv) { return round2(invoiceNet(state, inv) - invoicePaid(state, inv.id)); }
  function orderSummary(state, orderId) {
    const o = find(state.orders, orderId, 'Commande introuvable.');
    const invs = state.invoices.filter((i) => i.orderId === o.id);
    const invoiced = sum(invs, (i) => invoiceNet(state, i));
    const paid = sum(invs, (i) => invoicePaid(state, i.id));
    return { total: o.total, invoiced, toInvoice: round2(o.total - invoiced), paid, due: round2(invoiced - paid), unpaidTotal: round2(o.total - paid) };
  }
  function createInvoice(state, d, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const o = find(state.orders, d.orderId, 'Commande introuvable.');
    if (!INVOICE_TYPES.includes(d.type)) fail('Type de facture inconnu.');
    const amount = round2(d.amount);
    if (!(amount > 0)) fail('Le montant de la facture doit être supérieur à 0.');
    const s = orderSummary(state, o.id);
    if (amount > s.toInvoice + EPS) fail(`Montant supérieur au reste à facturer (${s.toInvoice}).`);
    const inv = { id: uid(), number: nextNumber(state, 'FAC', now), orderId: o.id, clientId: o.clientId, type: d.type, amount,
      issuedAt: isoDay(now), dueDate: trimmed(d, 'dueDate'), status: 'émise' };
    state.invoices.push(inv); audit(state, 'émission', 'factures', `${inv.number} (${inv.type})`, now); return inv;
  }
  function createCredit(state, d, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const inv = find(state.invoices, d.invoiceId, 'Facture introuvable.');
    const amount = round2(d.amount);
    if (!(amount > 0)) fail('Le montant de l’avoir doit être supérieur à 0.');
    const credited = invoiceCredits(state, inv.id);
    if (amount > round2(inv.amount - credited) + EPS) fail('Montant supérieur à ce qui reste avoir sur cette facture.');
    if (invoicePaid(state, inv.id) > round2(inv.amount - credited - amount) + EPS) fail('Cet avoir ferait passer la facture sous le montant déjà encaissé.');
    const reason = requireText(d.reason, 'Motif de l’avoir obligatoire.');
    const c = { id: uid(), number: nextNumber(state, 'AV', now), invoiceId: inv.id, amount, reason, issuedAt: isoDay(now) };
    state.credits.push(c); audit(state, 'avoir', 'avoirs', `${c.number} sur ${inv.number}`, now); return c;
  }
  function createPayment(state, d, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const inv = find(state.invoices, d.invoiceId, 'Facture introuvable.');
    const amount = round2(d.amount);
    if (!(amount > 0)) fail('Le montant du paiement doit être supérieur à 0.');
    const pending = sum(state.payments.filter((p) => p.invoiceId === inv.id && p.status === 'en attente'), (p) => p.amount);
    const available = round2(invoiceDue(state, inv) - pending);
    if (amount > available + EPS) fail(`Montant supérieur au solde disponible sur cette facture (${available}).`);
    if (!state.paymentModes.includes(d.method)) fail('Mode de paiement inconnu.');
    const reference = trimmed(d, 'reference');
    if (d.method === 'MVola' && !reference) fail('Référence MVola obligatoire pour valider ultérieurement la transaction.');
    const p = { id: uid(), number: nextNumber(state, 'PAY', now), invoiceId: inv.id, amount, method: d.method, reference,
      proof: trimmed(d, 'proof'), status: 'en attente', createdAt: isoDay(now), confirmedAt: null, rejectReason: '' };
    state.payments.push(p); audit(state, 'paiement déclaré', 'paiements', `${p.number} · ${amount}`, now); return p;
  }
  function confirmPayment(state, id, now = new Date()) {
    assertCan(state, 'paiements', 'w');
    const p = find(state.payments, id, 'Paiement introuvable.');
    if (p.status !== 'en attente') fail('Seul un paiement en attente peut être confirmé.');
    p.status = 'confirmé'; p.confirmedAt = isoDay(now);
    audit(state, 'encaissement confirmé', 'paiements', p.number, now); return p;
  }
  function rejectPayment(state, id, reason, now = new Date()) {
    assertCan(state, 'paiements', 'w');
    const p = find(state.payments, id, 'Paiement introuvable.');
    if (p.status !== 'en attente') fail('Seul un paiement en attente peut être rejeté.');
    p.status = 'rejeté'; p.rejectReason = requireText(reason, 'Motif du rejet obligatoire.');
    audit(state, 'paiement rejeté', 'paiements', p.number, now); return p;
  }

  /* Projets : circuit B, garde-fous financiers */
  function createProject(state, d, now = new Date()) {
    assertCan(state, 'projets', 'w');
    const name = requireText(d.name, 'Nom du projet obligatoire.');
    const personal = !!d.personal;
    let clientId = null, orderId = null;
    if (!personal) {
      const c = find(state.clients, d.clientId, 'Client requis pour un projet client.');
      clientId = c.id;
      if (d.orderId) {
        const o = find(state.orders, d.orderId, 'Commande introuvable.');
        if (o.clientId !== c.id) fail('La commande ne correspond pas à ce client.');
        orderId = o.id;
      }
    }
    const p = { id: uid(), number: nextNumber(state, 'PRJ', now), name, personal, clientId, orderId,
      stage: PROJECT_STAGES[0], deadline: trimmed(d, 'deadline'), notes: trimmed(d, 'notes'), createdAt: isoDay(now),
      history: [{ at: isoDay(now), stage: PROJECT_STAGES[0], comment: 'Création' }] };
    state.projects.push(p); audit(state, 'création', 'projets', name, now); return p;
  }
  const STAGE_GUARDS = {
    'Acompte reçu': (state, p) => (!p.orderId ? 'Lier une commande avant ce passage.' : (orderSummary(state, p.orderId).paid > EPS ? null : 'Acompte non encaissé : le projet ne peut pas avancer.')),
    'Conception': (state, p) => (!p.orderId ? 'Lier une commande avant la conception.' : (orderSummary(state, p.orderId).paid > EPS ? null : 'Acompte non encaissé : la conception ne peut pas démarrer.')),
    'Solde reçu': (state, p) => (!p.orderId ? 'Lier une commande pour enregistrer le solde.' : (orderSummary(state, p.orderId).unpaidTotal > EPS ? 'Solde non encaissé.' : null))
  };
  function advanceProject(state, id, now = new Date()) {
    assertCan(state, 'projets', 'w');
    const p = find(state.projects, id, 'Projet introuvable.');
    const i = PROJECT_STAGES.indexOf(p.stage);
    if (i < 0 || i >= PROJECT_STAGES.length - 1) fail('Ce projet ne peut pas avancer.');
    const next = PROJECT_STAGES[i + 1];
    if (!p.personal && STAGE_GUARDS[next]) { const err = STAGE_GUARDS[next](state, p); if (err) fail(err); }
    p.stage = next; p.history.push({ at: isoDay(now), stage: next, comment: '' });
    audit(state, 'étape', 'projets', `${p.name} → ${next}`, now); return p;
  }

  /* Licences : lecture seule, rien n'est inventé */
  /* Tableau de bord : KPI calculés à partir des données */
  function prevMonth(m) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 2, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
  function kpis(state, now = new Date()) {
    const day = isoDay(now), month = day.slice(0, 7), prev = prevMonth(month);
    const invs = state.invoices;
    const ca = sum(invs, (i) => invoiceNet(state, i));
    const ventesMois = sum(invs.filter((i) => i.issuedAt.startsWith(month)), (i) => invoiceNet(state, i));
    const ventesPrec = sum(invs.filter((i) => i.issuedAt.startsWith(prev)), (i) => invoiceNet(state, i));
    const conf = state.payments.filter((p) => p.status === 'confirmé');
    const encaisse = sum(conf, (p) => p.amount);
    const encaisseMois = sum(conf.filter((p) => (p.confirmedAt || '').startsWith(month)), (p) => p.amount);
    const creances = sum(invs, (i) => invoiceDue(state, i));
    const impayes = sum(invs.filter((i) => i.dueDate && i.dueDate < day && invoiceDue(state, i) > EPS), (i) => invoiceDue(state, i));
    const in30 = isoDay(new Date(now.getTime() + 30 * 864e5));
    const lic = state.licenses || [];
    return {
      ca, ventesMois, ventesPrec, encaisse, encaisseMois, creances, impayes,
      devisAttente: state.quotes.filter((q) => q.status === 'envoyé').length,
      commandesEnCours: state.orders.filter((o) => o.status !== 'livrée').length,
      projetsProduction: state.projects.filter((p) => ['Conception', 'Développement', 'Tests'].includes(p.stage)).length,
      projetsRetard: state.projects.filter((p) => p.deadline && p.deadline < day && p.stage !== 'Maintenance').length,
      livraisonsAttente: (state.deliveries || []).filter((d) => d.status === 'en cours').length,
      ticketsOuverts: (state.tickets || []).filter((t) => TICKET_OPEN.includes(t.status)).length,
      ticketsRetard: (state.tickets || []).filter((t) => isTicketLate(t, now)).length,
      appsCommercialisees: state.products.filter((p) => p.type === 'standard' && p.status === 'actif').length,
      licencesActives: lic.filter((l) => l.status === 'active').length,
      licencesExpirant: lic.filter((l) => l.status === 'active' && l.expiresAt && l.expiresAt >= day && l.expiresAt <= in30).length
    };
  }

  /* ================= PHASE 2 : production, livraisons, support, renouvellement, reporting ================= */
  const TASK_STATUS = ['À faire', 'En cours', 'Bloqué', 'Terminé'];
  const PRIORITIES = ['Haute', 'Moyenne', 'Basse'];
  const DELIVERY_STEPS = ['Préparation', 'Contrôle technique', 'Tests fonctionnels', 'Validation interne', 'Validation client', 'Mise à disposition', 'Réception', 'Archivage'];
  const DELIVERY_RECEPTION = DELIVERY_STEPS.indexOf('Réception');
  const DELIVERY_MISE = DELIVERY_STEPS.indexOf('Mise à disposition');
  const ARTIFACT_KEYS = ['apkDebug', 'apkApi23', 'apkApi29', 'sources', 'documentation'];
  const ARTIFACT_LABELS = { apkDebug: 'APK Debug', apkApi23: 'APK API23', apkApi29: 'APK API29', sources: 'Sources', documentation: 'Documentation' };
  const TICKET_SLA = { 'Critique': 24, 'Haute': 48, 'Normale': 120, 'Basse': 240 };
  const TICKET_STATUS = ['ouvert', 'en cours', 'en attente client', 'résolu', 'clos'];
  const TICKET_OPEN = ['ouvert', 'en cours', 'en attente client'];
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  function ensureP2(state) {
    ['tasks', 'deliveries', 'tickets', 'relances', 'licenseRegister'].forEach((k) => { if (!Array.isArray(state[k])) state[k] = []; });
    return state;
  }

  /* Production */
  function createTask(state, d, now = new Date()) {
    assertCan(state, 'projets', 'w');
    const project = find(state.projects, d.projectId, 'Projet introuvable.');
    const title = requireText(d.title, 'Titre de la tâche obligatoire.');
    if (!PRIORITIES.includes(d.priority)) fail('Priorité inconnue.');
    let dependsOn = null;
    if (d.dependsOn) {
      const dep = find(state.tasks, d.dependsOn, 'Tâche de dépendance introuvable.');
      if (dep.projectId !== project.id) fail('La dépendance doit appartenir au même projet.');
      dependsOn = dep.id;
    }
    const t = { id: uid(), number: nextNumber(state, 'TSK', now), projectId: project.id, title, responsable: trimmed(d, 'responsable'),
      priority: d.priority, deadline: trimmed(d, 'deadline'), status: 'À faire', dependsOn, blocage: '', createdAt: isoDay(now),
      history: [{ at: isoDay(now), status: 'À faire', comment: 'Création' }] };
    state.tasks.push(t); audit(state, 'création', 'tâches', title, now); return t;
  }
  function setTaskStatus(state, id, status, comment = '', now = new Date()) {
    assertCan(state, 'projets', 'w');
    const t = find(state.tasks, id, 'Tâche introuvable.');
    if (!TASK_STATUS.includes(status)) fail('Statut inconnu.');
    const c = String(comment || '').trim();
    if (status === 'Bloqué' && !c) fail('Un blocage doit être décrit.');
    if (status === 'Terminé' && t.dependsOn) {
      const dep = find(state.tasks, t.dependsOn);
      if (dep.status !== 'Terminé') fail(`Dépendance non terminée : « ${dep.title} ».`);
    }
    if (status === t.status) return t;
    t.status = status; t.blocage = status === 'Bloqué' ? c : '';
    t.history.push({ at: isoDay(now), status, comment: c });
    audit(state, 'statut', 'tâches', `${t.title} → ${status}`, now); return t;
  }

  /* Livraisons : processus en 8 étapes, aucune clôture sans contrôle */
  function createDelivery(state, d, now = new Date()) {
    assertCan(state, 'projets', 'w');
    const project = find(state.projects, d.projectId, 'Projet introuvable.');
    const version = requireText(d.version, 'Version livrée obligatoire.');
    const dl = { id: uid(), number: nextNumber(state, 'LIV', now), projectId: project.id, version, status: 'en cours', step: 0,
      artifacts: Object.fromEntries(ARTIFACT_KEYS.map((k) => [k, ''])), pv: null, createdAt: isoDay(now),
      steps: DELIVERY_STEPS.map((name) => ({ name, done: false, at: null, by: null, comment: '' })) };
    state.deliveries.push(dl); audit(state, 'création', 'livraisons', `${dl.number} · ${version}`, now); return dl;
  }
  function setDeliveryArtifacts(state, id, d, now = new Date()) {
    assertCan(state, 'projets', 'w');
    const dl = find(state.deliveries, id, 'Livraison introuvable.');
    if (dl.status !== 'en cours') fail('Cette livraison est clôturée.');
    if (dl.step >= DELIVERY_MISE) fail('Les fichiers ne peuvent plus changer après la mise à disposition.');
    ARTIFACT_KEYS.forEach((k) => { if (k in d) dl.artifacts[k] = trimmed(d, k); });
    audit(state, 'modification', 'livraisons', dl.number, now); return dl;
  }
  function recordDeliveryPV(state, id, d, now = new Date()) {
    assertCan(state, 'projets', 'w');
    const dl = find(state.deliveries, id, 'Livraison introuvable.');
    if (dl.step < DELIVERY_RECEPTION) fail('Le procès-verbal se rédige à l’étape Réception.');
    const receivedBy = requireText(d.receivedBy, 'Nom du réceptionnaire obligatoire.');
    dl.pv = { receivedBy, date: trimmed(d, 'date') || isoDay(now), reserves: trimmed(d, 'reserves'), at: isoDay(now) };
    audit(state, 'procès-verbal', 'livraisons', dl.number, now); return dl;
  }
  function advanceDelivery(state, id, comment = '', now = new Date()) {
    assertCan(state, 'projets', 'w');
    const dl = find(state.deliveries, id, 'Livraison introuvable.');
    if (dl.status === 'archivée') fail('Cette livraison est déjà archivée.');
    const idx = dl.step; const name = DELIVERY_STEPS[idx];
    if (name === 'Contrôle technique' && !dl.artifacts.apkDebug && !dl.artifacts.sources) fail('Renseigner au moins un APK ou les sources avant le contrôle technique.');
    if (name === 'Réception' && !dl.pv) fail('Procès-verbal de réception requis avant de valider la réception.');
    dl.steps[idx] = { name, done: true, at: isoDay(now), by: activeUser(state).name, comment: String(comment || '').trim() };
    dl.step = idx + 1;
    if (idx === DELIVERY_RECEPTION) dl.status = 'livrée';
    if (dl.step === DELIVERY_STEPS.length) dl.status = 'archivée';
    audit(state, 'étape livraison', 'livraisons', `${dl.number} · ${name}`, now); return dl;
  }

  /* Support */
  function createTicket(state, d, now = new Date()) {
    assertCan(state, 'support', 'w');
    const client = find(state.clients, d.clientId, 'Client introuvable.');
    const title = requireText(d.title, 'Objet du ticket obligatoire.');
    if (!has(TICKET_SLA, d.priority)) fail('Priorité inconnue.');
    let productId = null, projectId = null;
    if (d.productId) productId = find(state.products, d.productId, 'Produit introuvable.').id;
    if (d.projectId) {
      const p = find(state.projects, d.projectId, 'Projet introuvable.');
      if (p.personal) fail('Un projet personnel ne peut pas être relié à un ticket client.');
      if (p.clientId !== client.id) fail('Le projet ne correspond pas à ce client.');
      projectId = p.id;
    }
    const due = new Date(now.getTime() + TICKET_SLA[d.priority] * 36e5);
    const t = { id: uid(), number: nextNumber(state, 'TCK', now), clientId: client.id, productId, projectId, title,
      description: trimmed(d, 'description'), priority: d.priority, status: 'ouvert', assignee: null,
      dueAt: due.toISOString(), createdAt: now.toISOString(), resolution: '', satisfaction: null, comments: [] };
    state.tickets.push(t); audit(state, 'création', 'tickets', `${t.number} · ${title}`, now); return t;
  }
  function assignTicket(state, id, userId, now = new Date()) {
    assertCan(state, 'support', 'w');
    const t = find(state.tickets, id, 'Ticket introuvable.');
    if (userId) find(state.users, userId, 'Utilisateur introuvable.');
    t.assignee = userId || null;
    audit(state, 'affectation', 'tickets', t.number, now); return t;
  }
  function commentTicket(state, id, text, now = new Date()) {
    assertCan(state, 'support', 'w');
    const t = find(state.tickets, id, 'Ticket introuvable.');
    const s = requireText(text, 'Commentaire vide.');
    t.comments.push({ at: now.toISOString(), by: activeUser(state).name, text: s });
    audit(state, 'commentaire', 'tickets', t.number, now); return t;
  }
  function setTicketStatus(state, id, status, d = {}, now = new Date()) {
    assertCan(state, 'support', 'w');
    const t = find(state.tickets, id, 'Ticket introuvable.');
    if (!TICKET_STATUS.includes(status)) fail('Statut inconnu.');
    if (status === 'résolu') t.resolution = requireText(d.resolution, 'Décrire la résolution pour passer à « résolu ».');
    if (status === 'clos' && t.status !== 'résolu') fail('Un ticket doit être résolu avant d’être clos.');
    if (status === t.status) return t;
    t.status = status;
    if (status === 'en cours' && !t.assignee) t.assignee = activeUser(state).id;
    audit(state, 'statut', 'tickets', `${t.number} → ${status}`, now); return t;
  }
  function rateTicket(state, id, score, now = new Date()) {
    assertCan(state, 'support', 'w');
    const t = find(state.tickets, id, 'Ticket introuvable.');
    if (!['résolu', 'clos'].includes(t.status)) fail('La satisfaction se note une fois le ticket résolu.');
    const n = Number(score);
    if (!Number.isInteger(n) || n < 1 || n > 5) fail('Note entre 1 et 5.');
    t.satisfaction = n; audit(state, 'satisfaction', 'tickets', `${t.number} : ${n}/5`, now); return t;
  }
  function isTicketLate(t, now = new Date()) { return TICKET_OPEN.includes(t.status) && new Date(t.dueAt) < now; }
  function supportStats(state, now = new Date()) {
    const scores = state.tickets.filter((t) => t.satisfaction !== null).map((t) => t.satisfaction);
    return {
      open: state.tickets.filter((t) => TICKET_OPEN.includes(t.status)).length,
      late: state.tickets.filter((t) => isTicketLate(t, now)).length,
      avgSatisfaction: scores.length ? Math.round(scores.reduce((s, x) => s + x, 0) / scores.length * 10) / 10 : null
    };
  }

  /* Renouvellement et fidélisation */
  function createRelance(state, d, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const client = find(state.clients, d.clientId, 'Client introuvable.');
    const r = { id: uid(), clientId: client.id, note: requireText(d.note, 'Motif de la relance obligatoire.'), dueDate: trimmed(d, 'dueDate'), done: false, createdAt: isoDay(now) };
    state.relances.push(r); audit(state, 'création', 'relances', client.name, now); return r;
  }
  function toggleRelance(state, id, now = new Date()) {
    assertCan(state, 'ventes', 'w');
    const r = find(state.relances, id, 'Relance introuvable.');
    r.done = !r.done; audit(state, r.done ? 'relance faite' : 'relance rouverte', 'relances', r.note, now); return r;
  }
  function clientLastActivity(state, clientId) {
    const dates = [];
    state.quotes.filter((q) => q.clientId === clientId).forEach((q) => dates.push(q.createdAt));
    state.orders.filter((o) => o.clientId === clientId).forEach((o) => dates.push(o.createdAt));
    state.tickets.filter((t) => t.clientId === clientId).forEach((t) => dates.push(t.createdAt.slice(0, 10)));
    dates.sort();
    return dates.length ? dates[dates.length - 1] : null;
  }
  function inactiveClients(state, now = new Date(), days = 180) {
    const cutoff = isoDay(new Date(now.getTime() - days * 864e5));
    return state.clients
      .map((c) => ({ client: c, last: clientLastActivity(state, c.id) }))
      .filter((x) => (x.last ? x.last < cutoff : x.client.createdAt < cutoff));
  }

  /* Reporting : analyses à partir des données réelles */
  function pareto(state) {
    const byKey = {};
    state.orders.forEach((o) => {
      const ratio = o.subtotal ? o.total / o.subtotal : 1;
      o.lines.forEach((l) => {
        const key = l.productId || `libre:${l.designation}`;
        const name = l.productId ? ((state.products.find((p) => p.id === l.productId) || {}).name || l.designation) : l.designation;
        byKey[key] = byKey[key] || { key, name, value: 0 };
        byKey[key].value = round2(byKey[key].value + l.total * ratio);
      });
    });
    const rows = Object.values(byKey).sort((a, b) => b.value - a.value);
    const total = sum(rows, (r) => r.value);
    let cum = 0;
    return rows.map((r) => { cum = round2(cum + r.value); return { ...r, share: total ? round2(r.value / total * 100) : 0, cumShare: total ? round2(cum / total * 100) : 0 }; });
  }
  function paymentsByMethod(state) {
    const m = {};
    state.payments.forEach((p) => {
      m[p.method] = m[p.method] || { method: p.method, confirmed: 0, pending: 0, rejected: 0 };

  for(const key of Object.keys(merged)){if(Array.isArray(merged[key])&&Array.isArray(remote[key])){const map=new Map(remote[key].filter(x=>x&&x.id).map(x=>[x.id,x]));for(const item of merged[key])if(item&&item.id)map.set(item.id,item);merged[key]=[...map.values()]}else if(key==='company'&&remote.company){merged.company={...remote.company,...merged.company}}else if(key==='counters'&&remote.counters){merged.counters={...remote.counters,...merged.counters}}}
  return D.ensureP2(merged);
}

function quoteRowActions(q) {
  if (!W('ventes')) return btn('Imprimer', 'printQuote', { id: q.id });
  const b = [];
  if (q.status === 'brouillon') b.push(btn('Envoyer', 'quoteStatus', { id: q.id, status: 'envoyé' }));
  if (q.status === 'envoyé') { b.push(btn('Accepté', 'quoteStatus', { id: q.id, status: 'accepté' })); b.push(btn('Refusé', 'quoteStatus', { id: q.id, status: 'refusé' })); }
  if (q.status === 'refusé') b.push(btn('Réviser', 'quoteStatus', { id: q.id, status: 'brouillon' }));
  if (q.status === 'accepté' && !S.orders.some((o) => o.quoteId === q.id)) b.push(btn('Créer la commande', 'quoteOrder', { id: q.id }));
  b.push(btn('Imprimer', 'printQuote', { id: q.id }));
  return `<div class="row">${b.join('')}</div>`;
}
function orderRowActions(o) {
  if (!W('ventes')) return '';
  const s = D.orderSummary(S, o.id); const b = [];
  const hasInv = S.invoices.some((i) => i.orderId === o.id);
  if (!hasInv && o.depositPct > 0) b.push(btn('Facture d’acompte', 'orderInvoice', { id: o.id, type: 'acompte' }));
  if (s.toInvoice > EPS_UI) b.push(btn('Facturer le reste', 'orderInvoice', { id: o.id, type: 'solde' }));
  if (o.status === 'confirmée') b.push(btn('En production', 'orderStatus', { id: o.id, status: 'en production' }));
  if (o.status === 'en production') b.push(btn('Livrée', 'orderStatus', { id: o.id, status: 'livrée' }));
  return `<div class="row">${b.join('')}</div>`;
}
const EPS_UI = 0.005;
function invoiceRowActions(i) {
  const due = D.invoiceDue(S, i); const net = D.invoiceNet(S, i); const b = [];
  if (W('ventes') && due > EPS_UI) b.push(btn('Paiement', 'invoicePay', { id: i.id }));
  if (W('ventes') && net > EPS_UI) b.push(btn('Avoir', 'invoiceCredit', { id: i.id }));
  b.push(btn('Imprimer', 'printInvoice', { id: i.id }));
  return `<div class="row">${b.join('')}</div>`;
}
function paymentRowActions(p) {
  if (p.status !== 'en attente') return '';

  if (W('paiements')) { b.push(btn('Confirmer', 'paymentConfirm', { id: p.id })); b.push(btn('Rejeter', 'paymentReject', { id: p.id })); }
  return `<div class="row">${b.join('') || '<span class="mu">Validation réservée à la direction</span>'}</div>`;
}

function filterBar(scope, selects) {

}
function applyApps() {
  const f = UI.filters.apps;
  const cnt = (a) => UI.appCounts[a.productId] || { active: 0, revoked: 0 };
  const list = (UI.apps || []).filter((a) => !f.status || (f.status === 'actif' ? a.status === 'active' : a.status !== 'active'));
  const sorters = {
    nom: (a, b) => a.name.localeCompare(b.name, 'fr'),
    actives: (a, b) => cnt(b).active - cnt(a).active || a.name.localeCompare(b.name, 'fr'),
    revoquees: (a, b) => cnt(b).revoked - cnt(a).revoked || a.name.localeCompare(b.name, 'fr'),
    recent: (a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))
  };
  return list.slice().sort(sorters[f.sort] || sorters.nom);
}
function applyLicences() {
  const f = UI.filters.lic;
  const list = S.licenseRegister.filter((l) => (!f.status || l.status === f.status) && (!f.product || l.productId === f.product));
  const sorters = {
    client: (a, b) => a.customerName.localeCompare(b.customerName, 'fr'),
    recent: (a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')),
    expiration: (a, b) => String(a.expiresAt || '9999').localeCompare(String(b.expiresAt || '9999'))
  };
  return list.slice().sort(sorters[f.sort] || sorters.client);
}

const CSV_SEP = ';';
function toCsv(headers, rows) {
  const cell = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return '\uFEFF' + [headers, ...rows].map((r) => r.map(cell).join(CSV_SEP)).join('\r\n');
}
function downloadText(name, text, type = 'text/csv') {
  const blob = new Blob([text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ===================== LICENCES : jeton et registre ===================== */
const VAULT = { db: 'asu_vault', store: 'keys', tokenKey: 'asu_admin_token_enc' };
function openVaultDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(VAULT.db, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(VAULT.store);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function vaultKey() {
  const db = await openVaultDb();
  const existing = await new Promise((res, rej) => {
    const q = db.transaction(VAULT.store, 'readonly').objectStore(VAULT.store).get('aes');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
  if (existing) { db.close(); return existing; }
  // Clé non exportable : elle reste dans le navigateur et ne peut pas être copiée hors de l'appareil
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  await new Promise((res, rej) => {
    const t = db.transaction(VAULT.store, 'readwrite');
    t.objectStore(VAULT.store).put(key, 'aes');
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
  db.close();
  return key;
}
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function seal(text) {
  const key = await vaultKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(String(text)));
  return { iv: b64(iv), data: b64(ct) };
}
async function unseal(box) {
  const key = await vaultKey();
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.data));
  return new TextDecoder().decode(pt);
}
async function saveAdminToken(token) { localStorage.setItem(VAULT.tokenKey, JSON.stringify(await seal(token))); }
async function loadAdminToken() { const raw = localStorage.getItem(VAULT.tokenKey); return raw ? unseal(JSON.parse(raw)) : null; }
function forgetAdminToken() { localStorage.removeItem(VAULT.tokenKey); }
async function adminApi(path, opts = {}) {
  const token = await loadAdminToken();
  if (!token) throw new Error('Aucun jeton administrateur enregistré sur cet appareil.');
  const r = await fetch(APP.WORKER + path, {
    method: opts.method || 'GET', cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('Erreur HTTP ' + r.status));
  return data;
}

function r2Line(r2) {
  if (!r2) return 'R2 : non renseigné par le worker';
  if (r2.available) return `R2 : ${Math.round(r2.usedBytes / 1024 * 10) / 10} Ko dans ${r2.fileCount} fichier(s)`;
  const why = { not_configured: 'bucket non lié au Worker', table_unavailable: 'migration 0008 non appliquée' };
  return `R2 indisponible : ${why[r2.reason] || r2.reason}`;
}
function quotasCard(canW) {
  const q = UI.quotas;
  const head = `<div class="card"><h2>Quotas et consommation</h2>`;
  if (!q) return head + `<p class="note">Non lus. Ces chiffres viennent du worker et demandent le jeton administrateur.</p>${canW && localStorage.getItem(VAULT.tokenKey) ? btn('Actualiser les quotas', 'refreshQuotas') : ''}</div>`;
  const pct = (a, b) => (b ? Math.min(100, Math.round(a / b * 100)) : 0);
  const bar = (p) => `<div style="background:var(--bd);border-radius:6px;height:10px;overflow:hidden;margin:4px 0"><div style="height:100%;width:${p}%;background:${p >= 90 ? '#ef4444' : p >= 70 ? '#f59e0b' : 'var(--grad)'}"></div></div>`;
  const ko = (n) => (n >= 1048576 ? `${Math.round(n / 1048576 * 100) / 100} Mo` : `${Math.round(n / 1024 * 10) / 10} Ko`);
  const api = q.api || { totalRequests: 0, softLimit: 50000 };
  const apiP = pct(api.totalRequests, api.softLimit);
  return head + `

/* Formulaires modaux */
function lineRowHtml(p = {}) {
  const opts = ['<option value="">— libre —</option>'].concat(S.products.filter((x) => x.status === 'actif').map((x) => `<option value="${esc(x.id)}" ${p.productId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`)).join('');
  return `<div class="line" data-line>
    <select name="l_prod" aria-label="Produit">${opts}</select>
    <input name="l_des" placeholder="Désignation" value="${esc(p.designation || '')}" aria-label="Désignation">
    <input name="l_qty" type="number" min="0" step="any" value="${esc(p.qty ?? 1)}" aria-label="Quantité">
    <input name="l_price" type="number" min="0" step="any" value="${esc(p.price ?? 0)}" aria-label="Prix unitaire">
    <input name="l_disc" type="number" min="0" max="100" step="any" value="${esc(p.discount ?? 0)}" aria-label="Remise %">
    <button type="button" class="ghost small" data-act="removeLine" aria-label="Retirer la ligne">✕</button>
  </div>`;
}
const lineReader = (form) => [...form.querySelectorAll('[data-line]')].map((r) => ({
  productId: r.querySelector('[name=l_prod]').value || null,
  designation: r.querySelector('[name=l_des]').value,
  qty: r.querySelector('[name=l_qty]').value,
  price: r.querySelector('[name=l_price]').value,
  discount: r.querySelector('[name=l_disc]').value
}));
function openInvoiceForm(orderId, type = 'solde') {
  const o = byId(S.orders, orderId); const s = D.orderSummary(S, orderId);
  const pre = type === 'acompte' ? round2(o.total * (o.depositPct || 0) / 100) : s.toInvoice;
  openForm({
    title: `Facture · commande ${o.number}`, submitLabel: 'Émettre la facture',
    fields: [
      { type: 'note', label: `Reste à facturer : ${money(s.toInvoice)}. Une facture émise ne se modifie pas.` },
      { name: 'type', label: 'Type', type: 'select', options: D.INVOICE_TYPES.map((t) => [t, t]), value: type },
      { name: 'amount', label: 'Montant', type: 'number', step: 'any', required: true, value: pre },
      { name: 'dueDate', label: 'Échéance', type: 'date' }
    ],
    submit: (v) => D.createInvoice(S, { orderId, type: v.type, amount: v.amount, dueDate: v.dueDate })
  });
}
function openPaymentForm(invId) {
  const inv = byId(S.invoices, invId);
  const pending = S.payments.filter((p) => p.invoiceId === inv.id && p.status === 'en attente').reduce((s, p) => s + p.amount, 0);
  const avail = round2(D.invoiceDue(S, inv) - pending);
  openForm({
    title: `Paiement · facture ${inv.number}`, submitLabel: 'Déclarer le paiement',
    fields: [
      { type: 'note', label: 'Le paiement reste « en attente » jusqu’à validation manuelle. Un justificatif ne vaut pas confirmation d’encaissement.' },
      { name: 'amount', label: `Montant (disponible : ${money(avail)})`, type: 'number', step: 'any', required: true, value: avail },
      { name: 'method', label: 'Mode', type: 'select', options: S.paymentModes.map((m) => [m, m]) },
      { name: 'reference', label: 'Référence (obligatoire pour MVola)' },
      { name: 'proof', label: 'Justificatif (numéro ou description)', type: 'textarea' }
    ],
    submit: (v) => D.createPayment(S, { invoiceId: inv.id, amount: v.amount, method: v.method, reference: v.reference, proof: v.proof })
  });
}

/* Impression */
function printDocument(title, meta, lines, totals, extra = '') {
  const c = S.company;
  const rows = lines.map((l) => `<tr><td style="border-bottom:1px solid #ccc;padding:6px">${esc(l.designation)}</td><td style="border-bottom:1px solid #ccc;padding:6px;text-align:right">${l.qty}</td><td style="border-bottom:1px solid #ccc;padding:6px;text-align:right">${money(l.price)}</td><td style="border-bottom:1px solid #ccc;padding:6px;text-align:right">${money(l.total)}</td></tr>`).join('');
  document.getElementById('printArea').innerHTML = `
    <h1 style="font-size:20px">${esc(title)}</h1>
    <p><strong>${esc(c.name || 'Entreprise')}</strong><br>${esc(c.address || '')}<br>NIF ${esc(c.nif || '—')} · STAT ${esc(c.stat || '—')}</p>
    ${meta}
    <table style="width:100%;border-collapse:collapse;margin-top:12px"><thead><tr><th style="text-align:left;border-bottom:2px solid #000;padding:6px">Désignation</th><th style="text-align:right;border-bottom:2px solid #000;padding:6px">Qté</th><th style="text-align:right;border-bottom:2px solid #000;padding:6px">PU</th><th style="text-align:right;border-bottom:2px solid #000;padding:6px">Total</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="margin-top:12px;text-align:right">${totals}</div>
    ${extra}`;
  window.print();
}
function printQuote(id) {
  const q = byId(S.quotes, id); const cl = byId(S.clients, q.clientId);
  printDocument(`Devis ${q.number}`, `<p>Client : ${esc(cl ? cl.name : '—')}<br>Date : ${dateFr(q.createdAt)}${q.validUntil ? ` · Valide jusqu’au ${dateFr(q.validUntil)}` : ''}</p>`,
    q.lines, `<p>Sous-total : ${money(q.subtotal)}<br>Remise globale (${q.globalDiscount} %) : ${money(q.discount)}<br><strong>Total : ${money(q.total)}</strong></p>`,
    `<p>Acompte demandé : ${q.depositPct} %<br>Conditions : ${esc(q.paymentTerms || '—')}</p>`);
}
function printInvoice(id) {
  const inv = byId(S.invoices, id); const o = byId(S.orders, inv.orderId); const cl = byId(S.clients, inv.clientId);
  printDocument(`Facture ${inv.number}`, `<p>Client : ${esc(cl ? cl.name : '—')}<br>Date : ${dateFr(inv.issuedAt)} · Échéance : ${dateFr(inv.dueDate)}<br>Commande : ${esc(o ? o.number : '—')}</p>`,
    [{ designation: `Facturation ${inv.type}`, qty: 1, price: inv.amount, total: inv.amount }],
    `<p>Montant facturé : ${money(inv.amount)}<br>Avoirs : ${money(D.invoiceNet(S, inv) - inv.amount)}<br>Net : ${money(D.invoiceNet(S, inv))}<br>Encaissé : ${money(D.invoicePaid(S, inv.id))}<br><strong>Solde dû : ${money(D.invoiceDue(S, inv))}</strong></p>`);
}

    try{await cloudApi('/v1/cloud/snapshot?resource='+encodeURIComponent(APP.CLOUD_RESOURCE),{method:'PUT',body:{expectedRevision:remote.revision,snapshot:envelope}})}catch(e){if(e.status===409)throw new Error('Conflit de révision : les données locales ont été fusionnées, mais le Cloud a changé. Actualise puis vérifie avant de renvoyer.');throw e}

  cloudUpload:()=>runAsync(async()=>{
    const input=document.getElementById('r2File'),file=input?.files?.[0];if(!file)throw new Error('Choisis un fichier.');if(file.size<1||file.size>9.9*1024*1024)throw new Error('Le fichier doit peser entre 1 octet et 9,9 Mo avant chiffrement.');
    if(!cloudPrefs().attachments)throw new Error('La synchronisation des pièces jointes R2 est désactivée dans les préférences.');const pass=getBackupPin(true);
    const safe=file.name.normalize('NFKD').replace(/[^A-Za-z0-9._-]/g,'_').slice(-48)||'piece';const fileId=('f_'+Date.now()+'_'+safe).slice(0,80);
    const encrypted=await encryptR2Bytes(new Uint8Array(await file.arrayBuffer()),pass);if(encrypted.byteLength>10*1024*1024)throw new Error('Le fichier chiffré dépasse la limite R2 de 10 Mo.');
    const token=await cloudBearer();await v3Request('/v1/cloud/file?fileId='+encodeURIComponent(fileId),{method:'PUT',token,raw:true,body:encrypted,headers:{'Content-Type':'application/octet-stream','X-AppForge-Expected-Revision':'0'}});

  cloudDownload:async(ds)=>{
    try{const token=await cloudBearer();const {response,data}=await v3Request('/v1/cloud/file?fileId='+encodeURIComponent(ds.id),{method:'GET',token});const expected=response.headers.get('X-AppForge-SHA256');const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),n=>n.toString(16).padStart(2,'0')).join('');if(expected&&digest!==expected)throw new Error('Échec de vérification SHA-256 : fichier téléchargé non conforme.');const pass=document.getElementById('cloudPass')?.value||prompt('PIN de sauvegarde à 4 chiffres :')||'';if(!/^\d{4}$/.test(pass))throw new Error('PIN invalide : 4 chiffres requis.');const plain=await decryptR2Bytes(new Uint8Array(data),pass);const blob=new Blob([plain],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=ds.id.replace(/^f_\d+_/,'')||'fichier.bin';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Téléchargement vérifié.','ok')}catch(e){toast(e.message||'Téléchargement impossible.','err')}

function deliveryDetailHtml(dl) {
  const editable = dl.status === 'en cours';
  const canW = W('projets');
  const steps = dl.steps.map((s, i) => `<li class="${s.done ? 'done' : (editable && i === dl.step ? 'cur' : '')}">${esc(s.name)}${s.done ? ` — ${dateFr(s.at)} (${esc(s.by)})${s.comment ? ' · ' + esc(s.comment) : ''}` : ''}</li>`).join('');
  const artEditable = editable && canW && dl.step < D.DELIVERY_STEPS.indexOf('Mise à disposition');
  const artForm = `<form data-form="artifacts" data-id="${dl.id}" class="card"><h2 style="font-size:15px">Fichiers livrés (références)</h2>
    <p class="note">Indiquez le chemin, le lien ou l’identifiant de chaque fichier. Les fichiers eux-mêmes ne sont pas stockés dans l’application à cette phase.</p>
    <div class="formgrid">${D.ARTIFACT_KEYS.map((k) => `<label>${esc(D.ARTIFACT_LABELS[k])}<input name="${k}" value="${esc(dl.artifacts[k] || '')}" ${artEditable ? '' : 'disabled'}></label>`).join('')}</div>
    ${artEditable ? '<div class="row gap"><button class="small">Enregistrer les références</button></div>' : ''}</form>`;
  const pvBlock = dl.pv
    ? `<div class="card"><h2 style="font-size:15px">Procès-verbal de réception</h2><p>Réceptionné par ${esc(dl.pv.receivedBy)} le ${dateFr(dl.pv.date)}${dl.pv.reserves ? '<br>Réserves : ' + esc(dl.pv.reserves) : '<br>Sans réserve'}</p></div>`
    : (editable && canW && dl.step >= D.DELIVERY_STEPS.indexOf('Réception') - 0
      ? `<form data-form="pv" data-id="${dl.id}" class="card"><h2 style="font-size:15px">Procès-verbal de réception</h2>
          <div class="formgrid"><label>Réceptionné par<input name="receivedBy" required></label><label>Date<input type="date" name="date"></label>
          <label class="full">Réserves (vide si aucune)<textarea name="reserves" rows="2"></textarea></label></div>
          <div class="row gap"><button class="small">Enregistrer le PV</button></div></form>` : '');
  const next = editable ? `<div class="row gap">${canW ? `<button class="primary" data-act="deliveryAdvance" data-id="${dl.id}">Valider l’étape « ${esc(D.DELIVERY_STEPS[dl.step])} »</button>` : ''}</div>` : `<p class="gap">${statusBadge(dl.status)}</p>`;
  return `<ol class="steps">${steps}</ol>${next}${artForm}${pvBlock}`;
}

        productId: v.productId, customerName: v.customerName, customerEmail: v.customerEmail, plan: v.plan,
        maxDevices: Number(v.maxDevices) || 1, paymentReference: v.paymentReference, paymentConfirmed: v.paymentConfirmed } });
      codeModal(res.code, res.customerName);            // affiché avant tout chiffrement : le code ne se perd pas
      const cloud = { enabled: !!v.cloudEnabled, maxBytes: Math.round(Number(v.cloudMb) * 1048576), requestsDay: Number(v.cloudRequests), updatedAt: res.createdAt.slice(0, 10) };
      let cloudApplied = true;
      try { await adminApi('/admin/licenses/' + res.id + '/cloud', { method: 'PATCH', body: { enabled: cloud.enabled, maxBytes: cloud.maxBytes, requestsDay: cloud.requestsDay } }); }
      catch (e) { cloudApplied = false; }
      const code = await seal(res.code);
      D.addLicenseRecord(S, { id: res.id, productId: res.productId, customerName: res.customerName, customerEmail: v.customerEmail,
        plan: res.plan, maxDevices: res.maxDevices, paymentReference: v.paymentReference, createdAt: res.createdAt, expiresAt: res.expiresAt, code,
        cloud: cloudApplied ? cloud : { enabled: false, maxBytes: 0, requestsDay: 0, updatedAt: null } });
      if (!cloudApplied) toast('Licence créée, mais droits Cloud non confirmés : Cloud considéré désactivé. Corrigez avec « Droits Cloud » après vérification Worker.', 'err');
    } }); },
  revealCode: async (ds) => {
    const l = byId(S.licenseRegister, ds.id);
    if (!l || !l.code) return toast('Code introuvable.', 'err');
    try { codeModal(await unseal(l.code), l.customerName); }
    catch (e) { toast('Impossible de lire le code sur cet appareil.', 'err'); }
  },
  cloudEdit: async (ds) => {
    const l = byId(S.licenseRegister, ds.id);
    if (!l) return toast('Licence introuvable.', 'err');
    const cur = l.cloud || { enabled: false, maxBytes: 104857600, requestsDay: 10000 };
    openForm({ title: `Droits Cloud · ${l.customerName}`, async: true, submitLabel: 'Enregistrer les droits',
      fields: [
        { type: 'note', label: 'Droits de synchronisation de cette licence. Un client n’a le Cloud que s’il l’a payé.' },
        { name: 'enabled', label: 'Cloud activé', type: 'checkbox', value: cur.enabled },
        { name: 'mb', label: 'Quota de stockage (Mo)', type: 'number', step: 'any', value: Math.round(cur.maxBytes / 1048576 * 100) / 100 },
        { name: 'requests', label: 'Requêtes par jour', type: 'number', value: cur.requestsDay }
      ],
      submit: async (v) => {
        const body = { enabled: !!v.enabled, maxBytes: Math.round(Number(v.mb) * 1048576), requestsDay: Number(v.requests) };
        await adminApi('/admin/licenses/' + l.id + '/cloud', { method: 'PATCH', body });
        D.setLicenseCloud(S, l.id, body);
      } });
  },
  refreshQuotas: () => runAsync(async () => {
    const [api, q] = await Promise.all([adminApi('/admin/usage'), adminApi('/admin/quotas')]);
    UI.quotas = { ...q, api };
  }),
  dashboardKpi: (ds) => { UI.route = ds.v || 'reporting'; location.hash = '#/' + UI.route; render(); },
  appRegister: () => {
    if (!localStorage.getItem(VAULT.tokenKey)) return toast('Enregistre d’abord le jeton administrateur.', 'err');
    openForm({ title: 'Enregistrer une application dans le catalogue Worker', async: true, submitLabel: 'Enregistrer + Trial automatique',
      fields: [
        { name: 'name', label: 'Nom de l’application', required: true },
        { name: 'productId', label: 'Product ID unique (A-Z, 0-9, tirets)', required: true },
        { type: 'note', label: 'Le produit est enregistré côté Worker/D1. Il devient éligible au Trial automatique 72 h. Le compteur ne démarre qu’à la première activation en ligne du client.' }
      ],
      submit: async (v) => {
        const name = String(v.name || '').trim(); const productId = String(v.productId || '').trim().toUpperCase();
        if (name.length < 2 || name.length > 80) throw new Error('Nom invalide (2 à 80 caractères).');
        if (!/^[A-Z0-9][A-Z0-9-]{2,63}$/.test(productId)) throw new Error('Product ID invalide : 3 à 64 caractères, majuscules, chiffres et tirets.');
        if ((UI.apps || []).some(a => a.productId === productId)) throw new Error('Product ID déjà enregistré.');
        await adminApi('/admin/apps', { method: 'POST', body: { productId, name, status: 'active' } });
        const a = await adminApi('/admin/apps'); UI.apps = a.items || [];
        if (!UI.apps.some(a => a.productId === productId && a.status === 'active')) throw new Error('Produit non retrouvé actif après relecture Worker.');
      }
    });
  },
  refreshApps: () => runAsync(async () => {
    const [a, l] = await Promise.all([adminApi('/admin/apps'), adminApi('/admin/licenses')]);
    UI.apps = a.items || [];
    const counts = {};
    (l.items || []).forEach((x) => {
      const c = counts[x.productId] = counts[x.productId] || { active: 0, revoked: 0 };
      if (x.status === 'active') c.active++; else c.revoked++;
    });
    UI.appCounts = counts;
  }),
  toggleApp: (ds) => runAsync(async () => {
    const a = UI.apps.find((x) => x.productId === ds.id);
    if (!a) throw new Error('Application introuvable : actualisez la liste.');
    const status = a.status === 'active' ? 'inactive' : 'active';
    await adminApi('/admin/apps/' + a.productId, { method: 'PATCH', body: { name: a.name, status } });
    a.status = status;
  }),
  licenseEdit: (ds) => {
    const l = byId(S.licenseRegister, ds.id);
    if (!l) return toast('Licence introuvable.', 'err');
    openForm({ title: `Modifier · ${l.customerName}`, async: true, submitLabel: 'Enregistrer',
      fields: [
        { name: 'customerName', label: 'Client', required: true, value: l.customerName },
        { name: 'customerEmail', label: 'E-mail du client', type: 'email', value: l.customerEmail || '' },
        { name: 'paymentReference', label: 'Référence de paiement', value: l.paymentReference || '' },
        { name: 'maxDevices', label: 'Appareils autorisés (1 à 10)', type: 'number', value: l.maxDevices }
      ],
      submit: async (v) => {
        const body = { customerName: v.customerName, customerEmail: v.customerEmail, paymentReference: v.paymentReference, maxDevices: Number(v.maxDevices) };
        await adminApi('/admin/licenses/' + l.id, { method: 'PATCH', body });
        D.updateLicenseRecord(S, l.id, body);
      } });
  },
  licenseDelete: async (ds) => {
    const l = byId(S.licenseRegister, ds.id);
    if (!l) return toast('Licence introuvable.', 'err');
    if (!confirm(`Supprimer la licence de ${l.customerName} ? Elle sera révoquée côté Worker et retirée de ce registre. Le code ne sera plus lisible ici.`)) return;
    await runAsync(async () => {
      await adminApi('/admin/licenses/' + l.id, { method: 'DELETE' });
      D.deleteLicenseRecord(S, l.id);
    });
  },
  appRename: (ds) => {
    const a = (UI.apps || []).find((x) => x.productId === ds.id);
    if (!a) return toast('Actualisez la liste des applications.', 'err');
    openForm({ title: `Renommer · ${a.productId}`, async: true, submitLabel: 'Enregistrer',
      fields: [{ name: 'name', label: 'Nom affiché (2 à 80 caractères)', required: true, value: a.name }],
      submit: async (v) => {
        const name = String(v.name || '').trim();
        if (name.length < 2 || name.length > 80) throw new Error('Nom entre 2 et 80 caractères.');
        await adminApi('/admin/apps/' + a.productId, { method: 'PATCH', body: { name, status: a.status === 'active' ? 'active' : 'inactive' } });
        a.name = name;
      } });
  },
  appDelete: async (ds) => {
    const a = (UI.apps || []).find((x) => x.productId === ds.id);
    if (!a) return toast('Actualisez la liste des applications.', 'err');
    if (!confirm(`Supprimer « ${a.name} » ? Si elle a des licences, elle sera seulement archivée. Si elle a des licences actives, il faut d’abord les révoquer.`)) return;
    try {
      const res = await adminApi('/admin/apps/' + a.productId, { method: 'DELETE' });
      if (res.archived) { a.status = 'inactive'; toast('Application archivée : elle a encore des licences.', 'ok'); }
      else { UI.apps = UI.apps.filter((x) => x.productId !== a.productId); toast('Application supprimée.', 'ok'); }
      render();
    } catch (e) { toast(e.message, 'err'); }
  },
  copyCode: (ds) => { navigator.clipboard.writeText(ds.code).then(() => toast('Code copié.', 'ok'), () => toast('Copie impossible : sélectionnez le code à la main.', 'err')); },
  revokeLicense: (ds) => runAsync(async () => {
    await adminApi('/admin/licenses/' + ds.id + '/revoke', { method: 'POST' });
    D.revokeLicenseRecord(S, ds.id);
  })
});

function productFields(p = {}, edit = false) {
  const f = [

    { name: 'identifiant', label: 'Identifiant produit', required: !edit, value: p.identifiant || '' },
    { name: 'type', label: 'Type', type: 'select', options: D.PRODUCT_TYPES.map((t) => [t, t]), value: p.type || 'standard' },
    { name: 'category', label: 'Catégorie', value: p.category || '' },
    { name: 'price', label: 'Prix (Ar)', type: 'number', step: 'any', value: p.price ?? 0 },
    { name: 'licenseType', label: 'Type de licence', type: 'select', options: [['', '— aucun —']].concat(D.LICENSE_TYPES.map((t) => [t, t])), value: p.licenseType || '' },
