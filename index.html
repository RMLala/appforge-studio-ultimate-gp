<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10182b"><title>AppForge Studio Ultimate</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121b30;--panel2:#18243c;--line:#263653;--txt:#eef3ff;--muted:#9aabc8;--accent:#7c8cff;--good:#42c99a;--warn:#f2bd62;--bad:#ff7788}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:9px 12px}button.primary{background:linear-gradient(135deg,#6577ef,#8a65df);border:0}button.danger{color:#ff9aa6}input,select,textarea{width:100%;background:#0d1629;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--txt)}label{display:grid;gap:5px;color:var(--muted);font-size:12px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0e1729;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{font-weight:800;font-size:17px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--txt);border-color:var(--line)}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;background:#0b1020ed;backdrop-filter:blur(12px);z-index:2}.content{padding:26px;max-width:1500px;margin:auto}.muted{color:var(--muted)}h1{font-size:25px;margin:0 0 5px}h2{font-size:16px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.kpi strong{display:block;font-size:25px;margin-top:7px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar input{max-width:280px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;background:#101a2e}tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:3px 8px;border-radius:20px;background:#24314d;color:#cbd7f4;font-size:11px}.empty{padding:32px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.modal{position:fixed;inset:0;background:#050914c9;display:none;place-items:center;padding:18px;z-index:5}.modal.open{display:grid}.dialog{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.dialog form{display:grid;gap:13px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.toast{position:fixed;bottom:20px;right:20px;background:#213452;border:1px solid #40577c;padding:12px 16px;border-radius:10px;display:none;z-index:8}.toast.show{display:block}.mobile{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:4;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:.2s;box-shadow:20px 0 60px #0008}.side.open{transform:translateX(0)}.mobile{display:inline-block}.top{padding:0 14px}.content{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.kpi strong{font-size:20px}.formgrid{grid-template-columns:1fr}.content{padding:14px}}
</style></head>
<body><div class="app">
<aside class="side" id="side"><div class="brand">✦ AppForge Studio <small>ULTIMATE · WORKSPACE</small></div><nav class="nav" id="nav">
<button class="active" data-page="dashboard">◫ Tableau de bord</button><button data-page="clients">♙ Clients & CRM</button><button data-page="catalogue">▦ Catalogue</button><button data-page="quotes">▤ Devis</button><button data-page="orders">▣ Commandes</button><button data-page="invoices">▧ Factures</button><button data-page="payments">⇄ Paiements & encaissements</button><button data-page="projects">◈ Projets</button><button data-page="tasks">☷ Production</button><button data-page="deliveries">⇧ Livraisons</button><button data-page="licences">◇ Licences</button><button data-page="worker">☷ Licence & Worker V3</button><button data-page="support">♡ Support</button><button data-page="studio">✧ Studio / Brief</button><button data-page="cloud">☁ Cloud & sauvegarde</button><button data-page="settings">⚙ Paramètres</button></nav><div class="muted" style="margin-top:auto;font-size:11px">Données locales · v0.1.0 foundation</div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="mobile" id="menu">☰</button><strong id="crumb">Tableau de bord</strong></div><div style="display:flex;gap:8px"><button id="export">Exporter JSON</button><button id="importBtn">Importer</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></header>
<div class="content" id="view"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Ajouter</h2><form id="recordForm"><div id="fields" class="formgrid"></div><div class="actions"><button type="button" id="cancel">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='appforge-studio-ultimate-v010';
const WORKER_DEFAULT='https://appforge-license-api.lalainaadclick.workers.dev';
const WORKER_PREF='appforge-studio-worker-url-v1';
const labels={dashboard:'Tableau de bord',clients:'Clients & CRM',catalogue:'Catalogue',quotes:'Devis',orders:'Commandes',invoices:'Factures',payments:'Paiements & encaissements',projects:'Projets',tasks:'Production',deliveries:'Livraisons',licences:'Licences',worker:'Licence & Worker V3',support:'Support',studio:'Studio / Brief',cloud:'Cloud & sauvegarde',settings:'Paramètres'};
const schemas={
clients:[['name','Nom / société','text',true],['email','E-mail','email'],['phone','Téléphone','text'],['status','Statut','select',['Prospect','Client','Inactif']]],
catalogue:[['name','Produit / service','text',true],['type','Type','select',['Application standard','Application sur mesure','Service']],['price','Prix (Ar)','number'],['status','Statut','select',['Actif','Archivé']]],
quotes:[['ref','Référence','text',true],['clientId','ID client','text'],['client','Client','text',true],['amount','Montant (Ar)','number'],['validUntil','Valide jusqu’au','date'],['status','Statut','select',['Brouillon','Envoyé','Accepté','Refusé','Converti']]],
orders:[['ref','Référence','text',true],['quoteId','ID devis','text'],['client','Client','text',true],['amount','Montant (Ar)','number'],['deposit','Acompte attendu (Ar)','number'],['status','Statut','select',['À confirmer','Confirmée','En production','Terminée','Annulée']]],
invoices:[['ref','Référence','text',true],['orderId','ID commande','text'],['client','Client','text',true],['amount','Montant (Ar)','number'],['dueDate','Échéance','date'],['status','Statut','select',['À payer','Partiel','Payé','En retard']]],
payments:[['ref','Référence reçu','text',true],['invoiceId','ID facture','text'],['client','Client','text',true],['amount','Montant reçu (Ar)','number'],['method','Moyen','select',['MVola','Virement','Espèces','Carte','Autre']],['proof','Référence / preuve','text'],['status','Validation','select',['À vérifier','Confirmé','Rejeté']],['date','Date','date']],
projects:[['name','Nom du projet','text',true],['client','Client','text'],['kind','Nature','select',['Sur mesure','Standard','Interne']],['stage','Étape','select',['Conception','Commercial','Production','Tests','Livraison','Clôturé']]],
tasks:[['title','Tâche','text',true],['project','Projet','text'],['owner','Responsable','text'],['status','Statut','select',['À faire','En cours','Bloqué','Terminé']]],
deliveries:[['name','Livrable','text',true],['project','Projet','text'],['date','Date prévue','date'],['status','Statut','select',['Préparation','À valider','Livré']]],
licences:[['product','Produit','text',true],['client','Client','text'],['type','Type','select',['Essai 72h','Mensuelle','Annuelle','Lifetime']],['status','Statut','select',['À vérifier','Active','Suspendue','Expirée']]],
support:[['subject','Sujet','text',true],['client','Client','text'],['priority','Priorité','select',['Normale','Haute','Critique']],['status','Statut','select',['Ouvert','En cours','Résolu']]],
studio:[['title','Nom du brief','text',true],['client','Client','text'],['platform','Plateforme','select',['Web','Android','Desktop','PWA']],['notes','Besoins / notes','textarea']]
};
let db=load(),page='dashboard',editing=null;
function blank(){return {clients:[],catalogue:[],quotes:[],orders:[],invoices:[],payments:[],projects:[],tasks:[],deliveries:[],licences:[],support:[],studio:[],meta:{currency:'MGA',createdAt:new Date().toISOString()}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(!x||typeof x!=='object'||Array.isArray(x))return blank();const base=blank();for(const k of Object.keys(base)){if(k==='meta')base.meta={...base.meta,...(x.meta&&typeof x.meta==='object'?x.meta:{})};else if(Array.isArray(x[k]))base[k]=x[k].filter(r=>r&&typeof r==='object'&&typeof r.id==='string');}return base}catch{return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Stockage impossible : '+e.message);return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(n)||0)+' Ar'}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function sum(k,f){return db[k].reduce((a,x)=>a+(Number(x[f])||0),0)}
function validAmount(v){return v===''||(/^\d+(?:[.,]\d{1,2})?$/.test(String(v).trim())&&Number.isFinite(Number(String(v).replace(',','.')))&&Number(v)>=0)}
function render(){document.querySelector('#crumb').textContent=labels[page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const v=document.querySelector('#view');if(page==='dashboard'){v.innerHTML='<h1>Vue d’ensemble</h1><div class="muted">Indicateurs calculés à partir des données enregistrées dans cet espace.</div><div class="grid">'+[['Clients',db.clients.length],['Projets actifs',db.projects.filter(x=>x.stage!=='Clôturé').length],['Devis en cours',db.quotes.filter(x=>['Brouillon','Envoyé'].includes(x.status)).length],['Commandes',db.orders.length],['Facturé',money(sum('invoices','amount'))],['Encaissé confirmé',money(db.payments.filter(x=>x.status==='Confirmé').reduce((a,x)=>a+(Number(x.amount)||0),0))],['Tâches ouvertes',db.tasks.filter(x=>x.status!=='Terminé').length],['Livraisons à suivre',db.deliveries.filter(x=>x.status!=='Livré').length],['Tickets ouverts',db.support.filter(x=>x.status!=='Résolu').length]].map(x=>'<div class="card kpi"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="card"><h2>Raccourcis</h2><div class="toolbar"><button class="primary" data-add="clients">Nouveau client</button><button data-add="projects">Nouveau projet</button><button data-add="quotes">Nouveau devis</button><button data-add="tasks">Nouvelle tâche</button></div><p class="muted">Les données sont stockées localement sur cet appareil. Aucun état de licence ou de paiement n’est confirmé automatiquement.</p></div>';return}
if(page==='worker'){renderWorker(v);return}
if(page==='cloud'){v.innerHTML='<h1>Cloud & sauvegarde</h1><p class="muted">Mode local actif. Le raccordement au Worker V3 et la synchronisation D1/R2 ne sont pas encore activés dans cette fondation.</p><div class="card"><h2>État de la connexion</h2><p><span class="pill">Local uniquement</span></p><p class="muted">Worker configuré : https://appforge-license-api.lalainaadclick.workers.dev</p><button class="primary" id="backup">Télécharger une sauvegarde JSON</button></div>';return}
if(page==='settings'){v.innerHTML='<h1>Paramètres</h1><div class="card"><h2>Gestion des données</h2><p class="muted">Exportez régulièrement une sauvegarde. L’import fusionne les enregistrements par identifiant et ne supprime pas les données locales.</p><div class="toolbar"><button id="export2">Exporter JSON</button><button id="import2">Importer JSON</button><button class="danger" id="reset">Réinitialiser les données…</button></div><p class="muted">Devise : MGA · Stockage : localStorage · Version : 0.1.0</p></div>';return}
const rows=db[page]||[],cols=schemas[page]||[];v.innerHTML='<h1>'+labels[page]+'</h1><div class="toolbar"><input id="search" placeholder="Rechercher…"><button class="primary" data-add="'+page+'">＋ Ajouter</button><span class="muted">'+rows.length+' enregistrement(s)</span></div><div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>ID</th><th>Action</th></tr></thead><tbody id="tbody">'+tableRows(rows,cols)+'</tbody></table></div>';document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelector('#tbody').innerHTML=tableRows(rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)),cols)})}
function getWorkerUrl(){try{return localStorage.getItem(WORKER_PREF)||WORKER_DEFAULT}catch{return WORKER_DEFAULT}}
function validateWorkerUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='appforge-license-api.lalainaadclick.workers.dev'&&u.pathname==='/'&&!u.search&&!u.hash}catch{return false}}
function renderWorker(root){
 const url=getWorkerUrl();
 root.innerHTML='<h1>Licence & Worker V3</h1><p class="muted">Configuration centrale AppForge. Cet écran est distinct du registre commercial des licences clients.</p>'+
 '<div class="card"><h2>Worker central</h2><label>Adresse HTTPS du Worker<input id="workerUrl" type="url" spellcheck="false" value="'+esc(url)+'" autocomplete="url"></label>'+
 '<div class="toolbar"><button class="primary" id="workerSave">Enregistrer l’adresse</button><button id="workerReset">Rétablir l’adresse officielle</button><button id="workerTest">Tester /v1/config</button></div>'+
 '<p class="muted">Adresse officielle préconfigurée. Seul le domaine central AppForge est accepté. Aucun code de licence, jeton Cloud ou secret ne doit être saisi ici.</p></div>'+
 '<div class="grid"><div class="card"><span class="muted">Configuration Worker</span><strong id="workerState">Non vérifiée</strong><p class="muted" id="workerDetail">Lance un test pour lire la configuration publique.</p></div>'+
 '<div class="card"><span class="muted">Services métier</span><strong>Non raccordés</strong><p class="muted">Activation, statut, jeton Cloud, snapshots D1 et fichiers R2 ne sont pas encore intégrés à cette fondation.</p></div></div>'+
 '<div class="card"><h2>Réponse brute de /v1/config</h2><pre id="workerOutput" style="white-space:pre-wrap;overflow-wrap:anywhere;color:#cbd7f4;margin:0">Aucun test exécuté.</pre></div>';
}
async function testWorkerConfig(){
 const input=document.querySelector('#workerUrl'),state=document.querySelector('#workerState'),detail=document.querySelector('#workerDetail'),output=document.querySelector('#workerOutput'),button=document.querySelector('#workerTest');
 const url=(input?.value||'').trim();
 if(!validateWorkerUrl(url)){toast('Adresse refusée : HTTPS et domaine Worker AppForge officiel obligatoires');return}
 button.disabled=true;button.textContent='Vérification…';state.textContent='Test en cours';detail.textContent='Lecture publique de /v1/config…';output.textContent='Requête en cours…';
 try{
  const response=await fetch(url.replace(/\/$/,'')+'/v1/config',{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});
  const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{data={response:raw.slice(0,5000)}}
  output.textContent=JSON.stringify(data,null,2);
  if(!response.ok){state.textContent='Échec HTTP '+response.status;detail.textContent='Le Worker a répondu, mais la configuration n’a pas été acceptée.';return}
  state.textContent='Réponse reçue';detail.textContent='HTTP '+response.status+' · '+new Date().toLocaleString('fr-FR')+'. Cela confirme uniquement l’accès à /v1/config.';
  toast('Configuration Worker reçue (HTTP '+response.status+')');
 }catch(error){
  state.textContent='Inaccessible depuis ce navigateur';detail.textContent='Échec réseau/CORS : '+(error?.message||'erreur inconnue')+'. Le test doit être refait depuis un hébergement autorisé ou un environnement réseau compatible.';
  output.textContent='Aucune réponse exploitable. Vérifier la disponibilité du Worker et sa politique CORS.';
  toast('Test Worker non concluant');
 }finally{button.disabled=false;button.textContent='Tester /v1/config'}
}
function tableRows(rows,cols){if(!rows.length)return '<tr><td colspan="'+(cols.length+2)+'" class="empty">Aucune donnée. Utilisez « Ajouter » pour commencer.</td></tr>';return rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c[0]])+'</td>').join('')+'<td><span class="muted">'+esc(r.id.slice(0,8))+'</span></td><td><button data-edit="'+r.id+'">Modifier</button> <button class="danger" data-delete="'+r.id+'">Supprimer</button></td></tr>').join('')}
function openForm(k,id){page=k;editing=id||null;const r=id?db[k].find(x=>x.id===id):{};document.querySelector('#modalTitle').textContent=(id?'Modifier':'Ajouter')+' · '+labels[k];document.querySelector('#fields').innerHTML=schemas[k].map(c=>{let el=c[2]==='select'?'<select name="'+c[0]+'">'+c[3].map(o=>'<option '+(r?.[c[0]]===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':c[2]==='textarea'?'<textarea name="'+c[0]+'" rows="3">'+esc(r?.[c[0]]||'')+'</textarea>':'<input name="'+c[0]+'" type="'+c[2]+'" value="'+esc(r?.[c[0]]||'')+'" '+(c[3]?'required':'')+'>';return '<label>'+c[1]+el+'</label>'}).join('');document.querySelector('#modal').classList.add('open')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();document.querySelector('#side').classList.remove('open')}if(b.dataset.add)openForm(b.dataset.add);if(b.dataset.edit)openForm(page,b.dataset.edit);if(b.dataset.delete){if(confirm('Supprimer cet enregistrement ?')){db[page]=db[page].filter(x=>x.id!==b.dataset.delete);save();render();toast('Enregistrement supprimé')}}if(b.id==='menu')document.querySelector('#side').classList.toggle('open');if(b.id==='cancel')document.querySelector('#modal').classList.remove('open');if(b.id==='export'||b.id==='export2'||b.id==='backup')download();if(b.id==='importBtn'||b.id==='import2')document.querySelector('#importFile').click();if(b.id==='reset'&&confirm('Cette action effacera les données locales de cette application. Avez-vous exporté une sauvegarde ?')&&confirm('Confirmer définitivement la réinitialisation ?')){db=blank();save();render();toast('Données locales réinitialisées')}});
document.querySelector('#recordForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const old=editing?db[page].find(x=>x.id===editing):null;const item={...(old||{}),...data,id:old?.id||crypto.randomUUID(),updatedAt:new Date().toISOString(),createdAt:old?.createdAt||new Date().toISOString()};if(['price','amount','paid'].some(k=>k in data)&&Object.values(data).some(x=>x!==''&&!Number.isFinite(Number(x))&&/^\d/.test(x))){toast('Vérifiez les montants saisis');return}if(old)db[page]=db[page].map(x=>x.id===editing?item:x);else db[page].push(item);save();document.querySelector('#modal').classList.remove('open');render();toast('Enregistrement sauvegardé')});
function download(){const blob=new Blob([JSON.stringify({format:'AppForgeStudioBackup',version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='appforge-studio-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Sauvegarde exportée')}
document.querySelector('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){toast('Fichier trop volumineux (maximum 10 Mo)');e.target.value='';return}try{const x=JSON.parse(await f.text()),incoming=x.data||x;if(!incoming||typeof incoming!=='object')throw Error('Format JSON invalide');for(const k of Object.keys(schemas)){if(Array.isArray(incoming[k])){const map=new Map(db[k].map(r=>[r.id,r]));incoming[k].forEach(r=>{if(r&&typeof r==='object'){const id=typeof r.id==='string'&&r.id?r.id:crypto.randomUUID();map.set(id,{...map.get(id),...r,id})}});db[k]=[...map.values()]}}if(!save())throw Error('Échec de sauvegarde locale');render();toast('Import fusionné sans suppression')}catch(err){toast('Import refusé : '+err.message)}e.target.value=''});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='workerSave'){
  const value=(document.querySelector('#workerUrl')?.value||'').trim();
  if(!validateWorkerUrl(value)){toast('Adresse refusée : utilise le Worker HTTPS officiel');return}
  try{localStorage.setItem(WORKER_PREF,value);toast('Adresse Worker enregistrée localement')}catch{toast('Impossible d’enregistrer les préférences')}
 }
 if(b.id==='workerReset'){try{localStorage.setItem(WORKER_PREF,WORKER_DEFAULT);render();toast('Adresse officielle rétablie')}catch{toast('Stockage local indisponible')}}
 if(b.id==='workerTest')testWorkerConfig();
});
document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
render();
})();
</script></body></html>
