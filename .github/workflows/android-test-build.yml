name: AppForge Android Test APKs
on:
  push:
    branches: ['fix/android-build-sdk-licenses']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Avoid obsolete SDK "tools" package; modern command-line tools are installed by the action.
      - name: Setup Android SDK tools and accept licenses
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install required SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create temporary test signing key (not production key)
        run: keytool -genkeypair -v -keystore app/test-release.keystore -storepass test-password -alias test-key -keypass test-password -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=AppForge Test Build, OU=QA, O=RMLala, L=Antananarivo, C=MG'
      - name: Build four APK variants
        run: gradle --no-daemon assembleApi23Debug assembleApi23Release assembleApi29Debug assembleApi29Release
      - name: Verify APK outputs and signatures
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          for apk in app/build/outputs/apk/*/*/*.apk; do
            test -s "$apk"
            apksigner verify --verbose "$apk"
            echo "Verified: $apk"
            ls -lh "$apk"
          done
          test "$(find app/build/outputs/apk -name '*.apk' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-Business-Ultimate-Android-v1.1.1-API23-API29
          path: app/build/outputs/apk/*/*/*.apk
          retention-days: 30
