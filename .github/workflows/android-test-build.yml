name: AppForge Android Test APKs
on:
  push:
    branches: ['fix/android-build-sdk-licenses']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/build-tools/35.0.0:/usr/local/lib/android/sdk/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses non-interactively
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK platform/build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create temporary test signing key (not production key)
        run: keytool -genkeypair -v -keystore app/test-release.keystore -storepass test-password -alias test-key -keypass test-password -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=AppForge Test Build, OU=QA, O=RMLala, L=Antananarivo, C=MG'
      - name: Build Debug and signed Test Release APK
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify APK outputs and signatures
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/{debug,release}/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-Business-Ultimate-Android-v1.1.1-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 30
